<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101813">
  <meta name="description" content="Celovita priprava na teorijski izpit iz Algebre in diskretne matematike, zgrajena izključno iz teorijskih PDF-jev in teorijskih izpitov.">
  <title>ADM Teorija — priprava na teorijski izpit</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Preskoči na vsebino</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Glavna navigacija">
      <a class="brand" href="#/domov" aria-label="ADM Teorija — domov">
        <span class="brand-mark">A∴</span>
        <span><strong>ADM TEORIJA</strong><small>DEFINICIJE · IZREKI · DOKAZI</small></span>
      </a>

      <label class="search-box" for="global-search">
        <span aria-hidden="true">⌕</span>
        <input id="global-search" type="search" placeholder="Išči definicijo, izrek, dokaz …" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="search-results" id="search-results" hidden></div>

      <nav class="main-nav" aria-label="Načini učenja">
        <a href="#/domov" data-route="domov"><span>⌂</span> Pregled</a>
        <a href="#/nacrt" data-route="nacrt"><span>◴</span> Učni načrt</a>
        <a href="#/teorija" data-route="teorija"><span>≡</span> Vsa teorija</a>
        <a href="#/izreki" data-route="izreki"><span>◇</span> Definicije in izreki</a>
        <a href="#/vprasanja" data-route="vprasanja"><span>?</span> Teorijska vprašanja</a>
        <a href="#/kartice" data-route="kartice"><span>▱</span> Kartice</a>
        <a href="#/kviz" data-route="kviz"><span>✓</span> Kviz</a>
        <a href="#/izpit" data-route="izpit"><span>◉</span> Teorijski izpit</a>
        <a href="#/viri" data-route="viri"><span>↗</span> Viri</a>
      </nav>

      <div class="sidebar-progress">
        <div class="progress-ring" id="sidebar-progress" aria-label="Skupni napredek">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle class="ring-track" cx="24" cy="24" r="19"></circle>
            <circle class="ring-value" cx="24" cy="24" r="19"></circle>
          </svg>
          <span>0%</span>
        </div>
        <div><strong>Tvoj napredek</strong><small id="progress-copy">0 opravljenih sklopov</small></div>
      </div>
    </aside>

    <div class="page-shell">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="Odpri navigacijo" aria-expanded="false">☰</button>
        <div class="breadcrumb" id="breadcrumb">ADM Teorija <span>/</span> Pregled</div>
        <div class="topbar-actions">
          <button class="quiet-button" id="quick-random" type="button">Naključno vprašanje</button>
          <span class="save-status"><i></i> lokalno shranjeno</span>
        </div>
      </header>

      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>Za iskanje, kartice, kviz, zapis odgovorov in spremljanje napredka mora biti JavaScript omogočen.</noscript>
  <script src="vendor/katex/katex.min.js" defer></script>
  <script src="vendor/katex/contrib/auto-render.min.js" defer></script>
  <script src="content-logic.js" defer></script>
  <script src="content-counting.js" defer></script>
  <script src="content-algebra.js" defer></script>
  <script src="content-graphs.js" defer></script>
  <script src="practice-data.js" defer></script>
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
